name: Release preview
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/build.yml
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Create draft preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cat > notes.md <<'EOF'
          Preview build of Aether Matrix. AU and VST3 on macOS; VST3 on Windows x64.
          Updated metallic editor shared with Standalone: recessed style display, physical knobs, illuminated readouts and XY faders.
          Product website uses actual native captures, licensed studio footage and a real hybrid-engine audio example.
          The macOS plugin is universal. Local ONNX decoding is available on Apple Silicon and Windows x64 at 48 kHz; Intel uses hybrid synthesis.
          Includes a deterministic reference decoder, not a trained RAVE model.
          Unsigned installers. Real DAW validation is tracked in docs/RELEASE_REVIEW.md.
          EOF
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --title "Aether Matrix $RELEASE_TAG" --notes-file notes.md artifacts/Aether-Matrix-macOS/* artifacts/Aether-Matrix-Windows/*
