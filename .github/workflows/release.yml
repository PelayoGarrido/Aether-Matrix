name: Release candidate
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/build.yml
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/privacy_check.py
      - run: python3 scripts/verify_model.py
      - run: python3 -m unittest discover -s tests -p 'test_*tools.py' -v
      - run: sh -n scripts/build.sh installers/macos/build_pkg.sh installers/macos/postinstall
  release:
    needs: [build, source]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish verified release candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          test "$RELEASE_TAG" = 'v1.0.0-rc.1'
          gh release create "$RELEASE_TAG" --verify-tag --prerelease --latest=false --title "Aether Matrix $RELEASE_TAG — Piano Studio" --notes-file docs/releases/v1.0.0-rc.1.md artifacts/Aether-Matrix-macOS/* artifacts/Aether-Matrix-Windows/*
